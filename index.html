<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Word Forge</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Forge">
<meta name="theme-color" content="#1a1a2e">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a2e' width='100' height='100' rx='20'/><text y='68' x='50' text-anchor='middle' font-size='55'>&#9881;</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#FFD700;--silver:#C0C0C0;--bronze:#CD7F32;--bg:#1a1a2e;--bg2:#16213e;--accent:#e94560;--success:#4ade80;--text:#f0f0f0;--dim:#a0a0b0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw;touch-action:manipulation}
h1,h2,h3{font-family:'Fredoka One',cursive}
.screen{display:none;width:100%;height:100%;position:absolute;top:0;left:0}
.screen.active{display:flex;flex-direction:column}
.fade-in{animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.3);transform:scale(1.05)}}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(255,215,0,.2)}50%{box-shadow:0 0 30px rgba(255,215,0,.5)}}
@keyframes slotPop{from{transform:scale(1.3)}to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes confettiFall{to{top:110vh;transform:rotate(720deg)}}

/* TITLE */
#title-screen{align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
#title-screen h1{font-size:3.5rem;color:var(--gold);text-shadow:0 0 30px rgba(255,215,0,.4),0 4px 8px rgba(0,0,0,.5);margin-bottom:.5rem}
#title-screen .subtitle{font-size:1.2rem;color:var(--dim);margin-bottom:2rem}
.anvil-icon{font-size:5rem;margin-bottom:1rem;animation:glow 2s ease-in-out infinite alternate}

.btn{font-family:'Fredoka One',cursive;font-size:1.3rem;padding:16px 48px;border:none;border-radius:16px;cursor:pointer;transition:transform .15s;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#e94560,#c23152);color:#fff;box-shadow:0 6px 20px rgba(233,69,96,.4)}
.btn-secondary{background:linear-gradient(135deg,#4a6fa5,#3a5a8c);color:#fff;font-size:1.1rem;padding:12px 32px;box-shadow:0 4px 12px rgba(74,111,165,.3)}
.btn-success{background:linear-gradient(135deg,var(--success),#22c55e);color:var(--bg);box-shadow:0 6px 20px rgba(74,222,128,.4)}

/* VILLAGE */
#village-screen{background:linear-gradient(180deg,#87CEEB 0%,#87CEEB 40%,#5a8f3c 40%,#4a7a2e 100%)}
.village-header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(0,0,0,.2);backdrop-filter:blur(8px)}
.village-header h2{font-size:1.4rem;color:#fff}
.materials-bar{display:flex;gap:16px;align-items:center}
.material-count{display:flex;align-items:center;gap:4px;font-weight:700;font-size:1rem;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:20px}
.village-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:16px;padding:24px;align-items:center;justify-items:center}
.building-slot{width:100%;max-width:180px;aspect-ratio:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .2s;position:relative;padding:12px}
.building-slot:active{transform:scale(.95)}
.building-slot.locked{background:rgba(0,0,0,.2);border:3px dashed rgba(255,255,255,.3)}
.building-slot.available{background:rgba(255,255,255,.15);border:3px solid rgba(255,215,0,.6);box-shadow:0 0 20px rgba(255,215,0,.2);animation:pulse 2s ease-in-out infinite}
.building-slot.built{background:rgba(255,255,255,.1);border:3px solid rgba(74,222,128,.5)}
.building-icon{font-size:3rem}
.building-name{font-weight:700;font-size:.85rem;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5);color:#fff}
.building-quality{position:absolute;top:8px;right:8px;font-size:1.2rem}
.stats-bar{display:flex;justify-content:center;gap:24px;padding:12px;background:rgba(0,0,0,.2)}
.stat-item{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--dim)}

/* CHALLENGE SHARED */
.challenge-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
.stage-label{font-size:.9rem;text-transform:uppercase;letter-spacing:3px;color:var(--dim)}
.challenge-title{font-size:1.8rem;text-align:center}
.challenge-instruction{font-size:1.05rem;color:var(--dim);text-align:center;max-width:600px;line-height:1.6}
.progress-dots{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .3s}
.dot.active{background:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.5)}
.dot.done{background:var(--success)}
.dot-line{width:40px;height:3px;background:rgba(255,255,255,.1);border-radius:2px}
.dot-line.done{background:var(--success)}

/* DECODE */
#decode-screen{background:linear-gradient(135deg,#1a1a2e,#2d1b4e)}
.anvil-area{display:flex;gap:8px;justify-content:center;align-items:center;min-height:80px;padding:16px 24px;margin:8px 0;background:rgba(255,255,255,.04);border-radius:16px;border:2px dashed rgba(255,215,0,.25);min-width:280px}
.anvil-slot{width:52px;height:60px;border-radius:12px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:1.8rem;color:var(--gold);transition:all .2s}
